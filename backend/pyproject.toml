[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidenceos-backend"
version = "0.1.0"
description = "EvidenceOS backend: HTTP API, LangGraph workflow, agents and deterministic validation."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psycopg[binary,pool]>=3.2",
  "langgraph>=1.0",
  "anthropic>=0.40",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pgserver>=0.1.4", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
include = ["evidenceos*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"
markers = [
  "hard: critical evidence-integrity invariant (a failure blocks the harness)",
  "variance: tolerated model variance (reported, never blocking)",
  "failure: an injected fault (reported separately by the harness)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
